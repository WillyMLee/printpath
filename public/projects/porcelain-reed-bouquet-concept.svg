  <g transform="translate(684 264)"><path d="M0 0c-39-29-50-63-20-79 13 23 28 23 40 0 30 16 19 50-20 79Z" fill="#f7f5ef" stroke="#c5ccc7" stroke-width="3"/><circle cy="-39" r="10" fill="#5aa6c0"/></g>

