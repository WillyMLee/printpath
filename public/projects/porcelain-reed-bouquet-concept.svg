    <text x="74" y="547" fill="#39725f" font-size="12" font-weight="700" letter-spacing="1.4">VASE BODY</text><text x="74" y="575" fill="#18362d" font-size="19" font-weight="700">245 mm · white PETG</text><text x="74" y="596" fill="#718079" font-size="13">36 fine flutes · water-capable</text>
