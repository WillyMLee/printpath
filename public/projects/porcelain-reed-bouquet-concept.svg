    <circle cx="943" cy="241" r="9" fill="#89c8d9"/><text x="963" y="247" fill="#233d34" font-size="15" font-weight="700">3 flower silhouettes</text>
    <circle cx="943" cy="280" r="9" fill="#7caf8e"/><text x="963" y="286" fill="#233d34" font-size="15" font-weight="700">Flat-print stems + leaves</text>
    <circle cx="943" cy="319" r="9" fill="#f5d27f"/><text x="963" y="325" fill="#233d34" font-size="15" font-weight="700">Snap-fit color centers</text>
    <circle cx="943" cy="358" r="9" fill="#d7e2dc"/><text x="963" y="364" fill="#233d34" font-size="15" font-weight="700">Removable stem grid</text>
    <rect x="906" y="408" width="240" height="72" rx="18" fill="#e6f4ee" stroke="#badbce"/>
    <text x="930" y="436" fill="#39725f" font-size="12" font-weight="700" letter-spacing="1.2">PRINT PLAN</text><text x="930" y="462" fill="#18362d" font-size="17" font-weight="700">Vase + 3 bouquet plates</text>
