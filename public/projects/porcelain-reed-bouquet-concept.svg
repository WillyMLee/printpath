  <g fill="#79958a"><circle cx="582" cy="383" r="4"/><circle cx="604" cy="379" r="4"/><circle cx="626" cy="377" r="4"/><circle cx="648" cy="379" r="4"/><circle cx="670" cy="383" r="4"/></g>

  <!-- specification callouts -->
  <g font-family="Arial,sans-serif">
