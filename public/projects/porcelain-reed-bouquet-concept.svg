  <text x="54" y="98" fill="#18362d" font-family="Arial,sans-serif" font-size="34" font-weight="700">Porcelain Reed + Evergarden</text>
  <text x="54" y="128" fill="#718079" font-family="Arial,sans-serif" font-size="16">Fine white flutes · reusable bouquet · modular stem grid</text>

  <ellipse cx="626" cy="592" rx="200" ry="34" fill="#4e6e62" opacity=".16" filter="url(#shadow)"/>

  <!-- printable stems and leaves -->
