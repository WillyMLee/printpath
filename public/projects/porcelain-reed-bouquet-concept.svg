    <path d="M588 400Q558 290 500 210"/><path d="M620 400Q620 270 620 165"/><path d="M650 405Q692 300 742 218"/><path d="M605 405Q560 330 545 280"/><path d="M640 405Q655 322 684 268"/>
  </g>
