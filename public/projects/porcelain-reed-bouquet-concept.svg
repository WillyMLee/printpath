  <path d="M525 392Q626 414 727 392L720 604Q626 625 532 604Z" fill="url(#ribs)" opacity=".72"/>
  <ellipse cx="626" cy="383" rx="106" ry="28" fill="#f9faf8" stroke="#929d97" stroke-width="4"/>
  <ellipse cx="626" cy="385" rx="82" ry="16" fill="#29473d" opacity=".8"/>
