<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Porcelain Reed vase and printable Evergarden bouquet</title>
  <desc id="desc">A white fine-fluted vase with interchangeable three-dimensional flowers, stems, leaves, and a removable arrangement grid.</desc>
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f9f5"/><stop offset="1" stop-color="#edf3ef"/></linearGradient>
    <linearGradient id="vase" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d8dcd8"/><stop offset=".22" stop-color="#fff"/><stop offset=".58" stop-color="#eceeeb"/><stop offset=".82" stop-color="#fff"/><stop offset="1" stop-color="#ced3cf"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9dd6e5"/><stop offset="1" stop-color="#5aa6c0"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#315d78"/><stop offset="1" stop-color="#173b55"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="13"/></filter>
    <pattern id="ribs" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M2 0v10" stroke="#b7bdb9" stroke-width="2" opacity=".65"/><path d="M6 0v10" stroke="#fff" stroke-width="2" opacity=".85"/></pattern>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#stage)"/>
  <g stroke="#99afa6" opacity=".16"><path d="M0 520h1200M0 565h1200M0 610h1200"/><path d="M220 675 600 315 980 675M390 675 600 315 810 675M540 675l60-360 60 360"/></g>
