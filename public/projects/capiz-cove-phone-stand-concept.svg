    <linearGradient id="tide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4e1f3"/><stop offset="1" stop-color="#4cadd4"/></linearGradient>
    <radialGradient id="pane"><stop stop-color="#ffffff" stop-opacity=".98"/><stop offset=".75" stop-color="#e9f7fa" stop-opacity=".9"/><stop offset="1" stop-color="#b9dce8" stop-opacity=".75"/></radialGradient>
    <filter id="capiz-shadow"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#173d59" flood-opacity=".16"/></filter>
  </defs>
